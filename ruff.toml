target-version = "py313"
extend-include = ["*.ipynb"]

[lint]
select = ["ALL"]
ignore = [
    "COM812",                       # конфликтует с форматтером
    "RUF001", "RUF002", "RUF003",   # кириллица в строках, докстрингах, комментариях
    "PLR2004",                      # числа из формул лабы (0.299, 90°, 255) — предметные значения
    "D104", "D107",
    "CPY001",                       # копирайт в учебной лабе не нужен
]

[lint.isort]
known-first-party = ["lab_funcs"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"private/sandbox/*.py" = ["INP001"]
"scripts/*.py" = ["INP001"]
"**/test_*.py" = ["S101", "ANN", "D", "SLF001", "INP001"]
"*.ipynb" = ["D100", "T201", "S101", "E501", "INP001", "A004"]
