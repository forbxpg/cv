[project]
name = "cv-lab1"
version = "0.1.0"
description = "Лабораторная работа №1 по машинному зрению: методы улучшения контраста"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["private/sandbox"]
